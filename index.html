<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>G.2 Sem 1 Final Unit 1-4</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#fff;color:#18265f}
.app{height:100dvh;width:100%;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.title{height:8%;min-height:52px;background:#eee5ff;display:flex;align-items:center;justify-content:center;font-size:clamp(19px,2.7vw,31px);font-weight:800;color:#18265f}

.g.on{background:#7b61ff;border-color:#7b61ff;color:#fff}

.score{font-size:clamp(15px,2.2vw,24px);font-weight:800;color:#18265f}
.try{border:0;background:#7b61ff;color:#fff;border-radius:24px;padding:8px 18px;font-size:clamp(12px,1.8vw,19px);font-weight:800;touch-action:manipulation}
.msg{height:5%;min-height:28px;text-align:center;color:#49a99c;font-weight:800;font-size:clamp(12px,1.8vw,19px)}
.board{height:69%;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 18px 8px;overflow:hidden;background:linear-gradient(90deg,#fbf7fb 0%,#f8fbfe 100%)}
.side{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:7px;min-width:0;min-height:0;padding:7px 8px;border-radius:22px}
#left{background:#fdeaf2;box-shadow:0 2px 8px rgba(80,80,120,.08)}
#right{background:#eaf7fc;box-shadow:0 2px 8px rgba(80,80,120,.08)}
.card{min-width:0;min-height:0;border:3px solid #e8a0c0;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 5px;overflow:hidden;touch-action:manipulation;user-select:none;font-weight:700;color:#18265f}
#right .card{border-color:#a9d9ed}
.card.sel{border-color:#46a9e8;background:#f6fcff;box-shadow:0 0 0 1px #46a9e8 inset}
.card.bad{background:#ffc1c5;border-color:#e66d76;color:#7d2028;cursor:default}
.card.ok{background:#baf1c8;border-color:#35b765;color:#16733b;cursor:default}
.cn{font-size:clamp(10px,1.65vw,18px);line-height:1.05;font-weight:700;white-space:nowrap}
.py{font-size:clamp(11px,1.9vw,20px);line-height:1.05;margin-top:3px;white-space:nowrap}
.en{font-size:clamp(10px,1.65vw,18px);line-height:1.05}
@media (max-width:900px){
 .games{gap:4px;padding-left:5px;padding-right:5px}
 .g{padding:6px 9px}
 .board{gap:8px;padding-left:7px;padding-right:7px}
 .side{gap:5px;padding:5px}
}

.panel{min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:22px;overflow:hidden}
.panelTitle{height:13%;min-height:38px;display:flex;align-items:center;padding:0 22px;font-size:clamp(15px,2.3vw,27px);font-weight:800}
.panel:first-child{background:#fdeaf2}.panel:last-child{background:#eaf7fc}
.panel .side{height:87%;width:100%;background:transparent!important;box-shadow:none!important}
</style></head>
<body><div class="app"><div class="title">G.2 Sem 1 Final Unit 1-4</div>
<div class="games" id="games"></div><div class="controls"><span class="score" id="score"></span><button class="try" id="try">Try again</button></div>
<div class="msg" id="msg"></div><div class="board">
<div class="panel"><div class="panelTitle">A&nbsp;&nbsp; Chinese + Pinyin</div><div class="side" id="left"></div></div>
<div class="panel"><div class="panelTitle">B&nbsp;&nbsp; English</div><div class="side" id="right"></div></div>
</div></div>
<script>
const G=[{"title": "Game 1", "unit": "Unit 1", "items": [{"zh": "家", "py": "jiā", "en": "home"}, {"zh": "你家", "py": "nǐ jiā", "en": "your home"}, {"zh": "我家", "py": "wǒ jiā", "en": "my home"}, {"zh": "他", "py": "tā", "en": "he"}, {"zh": "他家", "py": "tā jiā", "en": "his home"}, {"zh": "哪儿", "py": "nǎr", "en": "where"}, {"zh": "中国", "py": "Zhōngguó", "en": "China"}, {"zh": "泰国", "py": "Tàiguó", "en": "Thailand"}, {"zh": "曼谷", "py": "Màngǔ", "en": "Bangkok"}, {"zh": "北京", "py": "Běijīng", "en": "Beijing"}, {"zh": "人", "py": "rén", "en": "People"}, {"zh": "吗", "py": "ma", "en": "Question"}]}, {"title": "Game 2", "unit": "Unit 1", "items": [{"zh": "我是中国人。", "py": "wǒ shì Zhōngguó rén.", "en": "I am Chinese."}, {"zh": "我是泰国人。", "py": "wǒ shì Tàiguó rén.", "en": "I am Thai."}, {"zh": "你是泰国人吗？", "py": "nǐ shì Tàiguó rén ma?", "en": "Are you Thai?"}, {"zh": "我不是泰国人。", "py": "wǒ bú shì Tàiguó rén.", "en": "I am not Thai."}, {"zh": "我家在曼谷。", "py": "wǒ jiā zài Màngǔ.", "en": "My home is in Bangkok."}, {"zh": "我家在北京。", "py": "wǒ jiā zài Běijīng.", "en": "My home is in Beijing."}]}, {"title": "Game 3", "unit": "Unit 2", "items": [{"zh": "几", "py": "jǐ", "en": "how many"}, {"zh": "岁", "py": "suì", "en": "years old"}, {"zh": "了", "py": "le", "en": "already"}, {"zh": "六", "py": "liù", "en": "six"}, {"zh": "七", "py": "qī", "en": "seven"}, {"zh": "八", "py": "bā", "en": "eight"}, {"zh": "你几岁了？", "py": "nǐ jǐ suì le?", "en": "How old are you already?"}, {"zh": "我六岁。", "py": "wǒ liù suì.", "en": "I am six years old."}, {"zh": "他八岁。", "py": "tā bā suì.", "en": "He is eight years old."}]}, {"title": "Game 4", "unit": "Unit 2", "items": [{"zh": "大", "py": "dà", "en": "older / bigger"}, {"zh": "小", "py": "xiǎo", "en": "younger / smaller"}, {"zh": "比", "py": "bǐ", "en": "than"}, {"zh": "我比你大。", "py": "wǒ bǐ nǐ dà.", "en": "I am older than you."}, {"zh": "你比他小。", "py": "nǐ bǐ tā xiǎo.", "en": "You are younger than him."}]}, {"title": "Game 5", "unit": "Unit 2", "items": [{"zh": "泰国人", "py": "Tàiguó rén", "en": "Thai person"}, {"zh": "中国人", "py": "Zhōngguó rén", "en": "Chinese person"}, {"zh": "你几岁了？", "py": "nǐ jǐ suì le?", "en": "How old are you already?"}, {"zh": "我六岁。", "py": "wǒ liù suì.", "en": "I am six years old."}, {"zh": "他七岁。", "py": "tā qī suì.", "en": "He is seven years old."}]}, {"title": "Game 6", "unit": "Unit 3", "items": [{"zh": "狗", "py": "gǒu", "en": "dog"}, {"zh": "小狗", "py": "xiǎo gǒu", "en": "puppy"}, {"zh": "猫", "py": "māo", "en": "cat"}, {"zh": "小猫", "py": "xiǎo māo", "en": "kitten"}, {"zh": "鸟", "py": "niǎo", "en": "bird"}, {"zh": "小鸟", "py": "xiǎo niǎo", "en": "little bird"}, {"zh": "狮子", "py": "shī zi", "en": "lion"}, {"zh": "小狮子", "py": "xiǎo shī zi", "en": "little lion"}, {"zh": "长颈鹿", "py": "cháng jǐng lù", "en": "giraffe"}, {"zh": "小长颈鹿", "py": "xiǎo cháng jǐng lù", "en": "little giraffe"}, {"zh": "熊猫", "py": "xióng māo", "en": "panda"}, {"zh": "小熊猫", "py": "xiǎo xióng māo", "en": "little panda"}, {"zh": "象", "py": "xiàng", "en": "elephant"}, {"zh": "小象", "py": "xiǎo xiàng", "en": "little elephant"}, {"zh": "牛", "py": "niú", "en": "cow"}, {"zh": "小牛", "py": "xiǎo niú", "en": "little calf"}, {"zh": "羊", "py": "yáng", "en": "sheep"}, {"zh": "小羊", "py": "xiǎo yáng", "en": "little lamb"}, {"zh": "燕子", "py": "yàn zi", "en": "swallow"}, {"zh": "小燕子", "py": "xiǎo yàn zi", "en": "little swallow"}]}, {"title": "Game 7", "unit": "Unit 3", "items": [{"zh": "哥哥", "py": "gē ge", "en": "older brother"}, {"zh": "姐姐", "py": "jiě jie", "en": "older sister"}, {"zh": "有一只猫。", "py": "yǒu yì zhī māo.", "en": "There is a cat."}, {"zh": "有两只鸟。", "py": "yǒu liǎng zhī niǎo.", "en": "There are two birds."}, {"zh": "我有一只熊猫。", "py": "wǒ yǒu yì zhī xióng māo.", "en": "I have a panda."}, {"zh": "我哥哥有一只小狗。", "py": "wǒ gē ge yǒu yì zhī xiǎo gǒu.", "en": "My brother has a puppy."}, {"zh": "我姐姐有一只小猫。", "py": "wǒ jiě jie yǒu yì zhī xiǎo māo.", "en": "My sister has a kitten."}, {"zh": "你有牛吗？", "py": "nǐ yǒu niú ma?", "en": "Do you have a cow?"}, {"zh": "我有。", "py": "wǒ yǒu.", "en": "Yes, I do."}, {"zh": "我没有。", "py": "wǒ méi yǒu.", "en": "No, I don’t."}, {"zh": "我有燕子。", "py": "wǒ yǒu yàn zi.", "en": "I have a swallow."}, {"zh": "我没有羊。", "py": "wǒ méi yǒu yáng.", "en": "I don’t have a sheep."}, {"zh": "两只小狗。", "py": "liǎng zhī xiǎo gǒu.", "en": "Two puppies."}, {"zh": "两只小鸟。", "py": "liǎng zhī xiǎo niǎo.", "en": "Two little birds."}]}, {"title": "Game 8", "unit": "Unit 3", "items": [{"zh": "你有猫吗？", "py": "nǐ yǒu māo ma?", "en": "Do you have a cat?"}, {"zh": "两只小猫", "py": "liǎng zhī xiǎo māo", "en": "two kittens"}, {"zh": "我没有小象。", "py": "wǒ méi yǒu xiǎo xiàng.", "en": "I don’t have a little elephant."}, {"zh": "有两只鸟。", "py": "yǒu liǎng zhī niǎo.", "en": "There are two birds."}, {"zh": "一只狗", "py": "yì zhī gǒu", "en": "one dog"}, {"zh": "我有小鸟。", "py": "wǒ yǒu xiǎo niǎo.", "en": "I have a little bird."}, {"zh": "我有。", "py": "wǒ yǒu.", "en": "Yes, I do."}, {"zh": "两只小狗", "py": "liǎng zhī xiǎo gǒu", "en": "two puppies"}, {"zh": "我姐姐有一只猫。", "py": "wǒ jiě jie yǒu yì zhī māo.", "en": "My older sister has a cat."}, {"zh": "你有狗吗？", "py": "nǐ yǒu gǒu ma?", "en": "Do you have a dog?"}, {"zh": "我没有。", "py": "wǒ méi yǒu.", "en": "No, I don’t."}, {"zh": "我哥哥有一只狗。", "py": "wǒ gē ge yǒu yì zhī gǒu.", "en": "My older brother has a dog."}, {"zh": "有一只狗。", "py": "yǒu yì zhī gǒu.", "en": "There is a dog."}, {"zh": "两只鸟", "py": "liǎng zhī niǎo", "en": "two birds"}, {"zh": "我有一只猫。", "py": "wǒ yǒu yì zhī māo.", "en": "I have a cat."}]}, {"title": "Game 9", "unit": "Unit 4", "items": [{"zh": "前边", "py": "qiánbian", "en": "in front"}, {"zh": "地上", "py": "dìshang", "en": "on the ground"}, {"zh": "上", "py": "shàng", "en": "up / on"}, {"zh": "后边", "py": "hòubian", "en": "at the back"}, {"zh": "天", "py": "tiān", "en": "sky"}, {"zh": "下边", "py": "xiàbian", "en": "under"}, {"zh": "地", "py": "dì", "en": "ground"}, {"zh": "后", "py": "hòu", "en": "back"}, {"zh": "上边", "py": "shàngbian", "en": "on top"}, {"zh": "天上", "py": "tiānshàng", "en": "in the sky"}, {"zh": "下", "py": "xià", "en": "down"}, {"zh": "前", "py": "qián", "en": "front"}]}, {"title": "Game 10", "unit": "Unit 4", "items": [{"zh": "马", "py": "mǎ", "en": "horse"}, {"zh": "它们", "py": "tāmen", "en": "they"}, {"zh": "兔", "py": "tù", "en": "rabbit"}, {"zh": "走", "py": "zǒu", "en": "walk"}, {"zh": "飞", "py": "fēi", "en": "fly"}, {"zh": "爬", "py": "pá", "en": "crawl"}, {"zh": "它", "py": "tā", "en": "it"}, {"zh": "跑", "py": "pǎo", "en": "run"}, {"zh": "跳", "py": "tiào", "en": "jump"}, {"zh": "乌龟", "py": "wūguī", "en": "turtle"}]}];
let gi=0,sel=null,score=0,locked=new Set(),bad=new Set();
const gb=document.getElementById('games'),L=document.getElementById('left'),R=document.getElementById('right'),S=document.getElementById('score'),M=document.getElementById('msg');
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tabs(){gb.innerHTML='';G.forEach((g,i)=>{let b=document.createElement('button');b.className='g '+(i==gi?'on':'');b.textContent=g.title;b.onclick=()=>{gi=i;start()};gb.appendChild(b)})}
function upd(){S.textContent=`Score: ${score}/${G[gi].items.length}`;M.textContent=score==G[gi].items.length?'🎉 Great job! Perfect score!':''}
function lc(o,i){let d=document.createElement('div');d.className='card';d.dataset.i=i;d.innerHTML=`<div><div class="cn">${o.zh}</div><div class="py">${o.py}</div></div>`;d.onclick=()=>leftPick(i,d);return d}
function rc(o,i){let d=document.createElement('div');d.className='card';d.dataset.i=i;d.innerHTML=`<div class="en">${o.en}</div>`;d.onclick=()=>rightPick(i);return d}
function leftPick(i,d){if(locked.has(i)||bad.has(i))return;document.querySelectorAll('#left .sel').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');sel=i}
function rightPick(i){if(sel===null||locked.has(i))return;let a=sel,ld=document.querySelector(`#left .card[data-i="${a}"]`);if(a===i){ld.classList.remove('sel');ld.classList.add('ok');document.querySelector(`#right .card[data-i="${i}"]`).classList.add('ok');locked.add(i);score++;sel=null;upd()}else{ld.classList.remove('sel');ld.classList.add('bad');bad.add(a);sel=null}}
function start(){score=0;sel=null;locked=new Set();bad=new Set();tabs();L.innerHTML='';R.innerHTML='';G[gi].items.forEach((o,i)=>{});sh(G[gi].items.map((o,i)=>[o,i])).forEach(([o,i])=>L.appendChild(lc(o,i)));sh(G[gi].items.map((o,i)=>[o,i])).forEach(([o,i])=>R.appendChild(rc(o,i)));upd()}
document.getElementById('try').onclick=start;start();
</script></body></html>
